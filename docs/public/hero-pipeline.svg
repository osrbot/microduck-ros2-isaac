<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">MicroDuck ROS 2 and Isaac Sim tutorial</title>
  <desc id="desc">Open MicroDuck in RViz, move its joints, or make it walk in Isaac Sim.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#fff4e8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#23cfc7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#68432a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect x="34" y="26" width="572" height="420" rx="34" fill="url(#panel)" filter="url(#shadow)"/>
  <circle cx="84" cy="77" r="7" fill="#ff7a2f"/>
  <circle cx="108" cy="77" r="7" fill="#23cfc7"/>
  <circle cx="132" cy="77" r="7" fill="#f24a9d"/>
  <text x="84" y="128" fill="#81756c" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="700" letter-spacing="2">LET'S WADDLE</text>
  <rect x="78" y="150" width="484" height="66" rx="17" fill="#ffffff" stroke="#e9dcd0"/>
  <text x="106" y="190" fill="#17171f" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="750">MicroDuck model + walking policy</text>
  <path d="M320 216v42" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M320 258l-10-13h20z" fill="#e65f22"/>
  <rect x="78" y="279" width="144" height="104" rx="19" fill="#fff1e7" stroke="#ffc39f"/>
  <rect x="248" y="279" width="144" height="104" rx="19" fill="#eafaf7" stroke="#99e6df"/>
  <rect x="418" y="279" width="144" height="104" rx="19" fill="#fff0f7" stroke="#f7add0"/>
  <circle cx="114" cy="316" r="16" fill="#ff7a2f" opacity=".18"/>
  <circle cx="284" cy="316" r="16" fill="#23cfc7" opacity=".2"/>
  <circle cx="454" cy="316" r="16" fill="#f24a9d" opacity=".17"/>
  <text x="104" y="322" fill="#cf5518" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="800">ROS</text>
  <text x="274" y="322" fill="#087f79" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="800">USD</text>
  <text x="442" y="322" fill="#be2871" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="800">AI</text>
  <text x="103" y="355" fill="#17171f" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="750">RViz + TF</text>
  <text x="269" y="355" fill="#17171f" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="750">Isaac Sim</text>
  <text x="438" y="355" fill="#17171f" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="750">Policy</text>
  <path d="M222 331h26M392 331h26" stroke="#c9b6a7" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 7"/>
  <rect x="78" y="404" width="484" height="1" fill="#e3d6ca"/>
  <text x="78" y="426" fill="#81756c" font-family="ui-sans-serif, system-ui" font-size="14">meet the duck · wiggle the joints · make it walk</text>
</svg>
